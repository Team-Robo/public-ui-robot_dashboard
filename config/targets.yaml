# Naming-contract target graph. Credentials must come from the process environment.
# Operational e-stop exemptions are marked with `estop_exempt: true`; see README.md.
targets:
- id: foxglove_bridge
  label: Foxglove Bridge
  category: infra
  kind: launch
  package: foxglove_bridge
  launch_file: foxglove_bridge_launch.xml
  args: []
  flags:
  - name: debug
    label: Debug logging
    arg: debug:=true
    type: toggle
    options: []
  env: {}
  autostart: false
  estop_exempt: true
  ready_timeout_sec: 10.0

- id: rviz2
  label: RViz2
  category: infra
  kind: run
  package: rviz2
  executable: rviz2
  args: []
  env: {}
  autostart: false
  estop_exempt: true
  flags: []
  ready_timeout_sec: 10.0

- id: debug_harness
  label: Dashboard Debug Harness
  category: debug
  kind: run
  package: robot_dashboard
  executable: dashboard_debug_harness
  args: []
  env: {}
  autostart: false
  ready_node_name: /dashboard_debug_harness
  estop_exempt: false
  flags: []
  ready_timeout_sec: 10.0

